<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="../shared/assets/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Documents — RealtyAI</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css" />
<link rel="stylesheet" href="../shared/app-shell.css" />
<style>
  .docs-layout { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 65px); }
  .back-to-docs-btn { display: none; }

  @media (max-width: 768px) {
    .docs-layout { grid-template-columns: 1fr !important; height: calc(100vh - 60px) !important; }
    .docs-list, .doc-panel { display: none; }
    .docs-layout.showing-list .docs-list { display: block; }
    .docs-layout.showing-detail .doc-panel { display: block; }
    .back-to-docs-btn {
      display: flex; align-items: center; gap: 6px; background: none; border: none;
      font-size: 13px; font-weight: 600; color: var(--gold-600); padding: 12px 0 0; cursor: pointer;
    }
  }
  .docs-list { border-right: 1px solid var(--olive-200); overflow-y: auto; padding: 16px; }
  .docs-list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .docs-actions { display: flex; gap: 8px; margin-bottom: 16px; }
  .docs-actions .btn { font-size: 12px; padding: 8px 12px; flex: 1; justify-content: center; }

  .doc-item { padding: 12px; border-radius: 10px; cursor: pointer; margin-bottom: 6px; border: 1px solid transparent; }
  .doc-item:hover { background: var(--cream-dim); }
  .doc-item.active { background: var(--gold-100); border-color: var(--gold-400); }
  .doc-item-title { font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
  .doc-item-meta { font-size: 11px; color: var(--ink-500); display: flex; gap: 6px; align-items: center; }

  .risk-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .risk-dot.high { background: var(--danger); }
  .risk-dot.caution { background: var(--gold-500); }
  .risk-dot.low { background: var(--success); }

  .doc-panel { padding: 28px 32px; overflow-y: auto; }
  .doc-panel-empty { height: 100%; display: flex; align-items: center; justify-content: center; color: var(--ink-500); font-size: 14px; }
  .doc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .doc-title { font-size: 20px; font-family: var(--font-display); }
  .doc-meta-row { font-size: 12.5px; color: var(--ink-500); margin-top: 4px; }
  .doc-actions { display: flex; gap: 8px; }
  .doc-actions .btn { font-size: 12.5px; padding: 8px 14px; }

  .risk-banner { padding: 12px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; margin-bottom: 20px; }
  .risk-banner.high { background: #fbe9e5; color: var(--danger); }
  .risk-banner.caution { background: var(--gold-100); color: var(--gold-600); }
  .risk-banner.low { background: #e7f0e4; color: var(--success); }

  .flag-card { border: 1px solid var(--olive-200); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; font-size: 12.5px; }
  .flag-card .phrase { font-weight: 700; margin-bottom: 3px; }
  .flag-card .expl { color: var(--ink-700); }

  textarea#doc-content { width: 100%; min-height: 320px; padding: 16px; border: 1px solid var(--olive-200); border-radius: 10px; font-family: var(--font-body); font-size: 13.5px; line-height: 1.6; margin-top: 16px; }

  .rework-row { display: flex; gap: 8px; margin-top: 12px; }
  .rework-row input { flex: 1; padding: 10px 12px; border: 1px solid var(--olive-200); border-radius: 8px; font-size: 13px; }

  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(36,31,24,0.4); align-items: center; justify-content: center; z-index: 50; }
  .modal-backdrop.open { display: flex; }
  .modal { background: #fff; border-radius: 14px; padding: 28px; width: 440px; max-width: 90vw; }
  .modal h3 { margin-bottom: 16px; }
  .modal select, .modal input, .modal textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--olive-200); border-radius: 8px; font-size: 13.5px; margin-bottom: 12px; font-family: var(--font-body); }
  .modal textarea { min-height: 80px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar-mount" data-active="documents"></aside>

  <div class="main-col">
    <div class="topbar">
      <div class="topbar-search">🔍 Ask about clients, listings, tasks, regulations…</div>
      <div class="topbar-user"><div class="avatar-chip">A</div><div class="name">Test Agent</div></div>
    </div>

    <div class="docs-layout showing-list" id="docs-layout">
      <div class="docs-list">
        <div class="docs-list-header"><strong style="font-family:var(--font-display); font-size:16px;">Documents</strong></div>
        <div class="docs-actions">
          <label class="btn btn-primary" style="cursor:pointer;">
            Upload<input type="file" id="file-input" accept=".pdf,.docx,.txt,.md" style="display:none;" />
          </label>
          <button class="btn btn-outline" id="new-doc-btn">+ New</button>
        </div>
        <div id="doc-items"></div>
      </div>

      <div class="doc-panel" id="doc-panel">
        <div class="doc-panel-empty">Select a document, upload one, or create a new one.</div>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h3 class="display">Create a document</h3>
    <select id="new-doc-type"></select>
    <input type="text" id="new-doc-title" placeholder="Document title" />
    <textarea id="new-doc-instructions" placeholder="Any specific instructions (optional)…"></textarea>
    <div class="modal-actions">
      <button class="btn btn-outline" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-generate">Generate</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/supabase-client.js"></script>
<script src="../shared/api.js"></script>
<script src="../shared/sidebar.js"></script>
<script src="../shared/system-modal.js"></script>
<script src="../shared/athena-spinner.js"></script>
<script>
  auth.requireAuth();

  let documents = [];
  let selectedId = null;

  const TYPE_LABELS = {
    marketing_flyer: "Marketing Flyer",
    listing_description: "Listing Description",
    disclosure_draft: "Disclosure Draft",
    buyer_guide: "Buyer Guide",
    seller_guide: "Seller Guide",
    email_newsletter: "Email Newsletter",
    transaction_checklist: "Transaction Checklist",
    cover_letter: "Cover Letter",
    listing_agreement_prep: "Listing Agreement Deal Points (not a contract)",
    purchase_offer_prep: "Purchase Offer Worksheet (not a contract)",
    uploaded_other: "Uploaded Document",
  };

  async function loadDocuments() {
    documents = await api.listDocuments();
    renderList();
  }

  function renderList() {
    const container = document.getElementById("doc-items");
    if (!documents.length) {
      container.innerHTML = `<div style="padding:16px; font-size:13px; color:var(--ink-500);">No documents yet.</div>`;
      return;
    }
    container.innerHTML = documents
      .map(
        (d) => `
      <div class="doc-item ${d.id === selectedId ? "active" : ""}" data-id="${d.id}">
        <div class="doc-item-title">${d.title}</div>
        <div class="doc-item-meta">
          <span class="risk-dot ${d.compliance_risk || "low"}"></span>
          ${TYPE_LABELS[d.doc_type] || d.doc_type} · ${d.source}
        </div>
      </div>`
      )
      .join("");

    container.querySelectorAll(".doc-item").forEach((el) => {
      el.addEventListener("click", () => selectDocument(el.dataset.id));
    });
  }

  async function selectDocument(id) {
    selectedId = id;
    renderList();
    const doc = await api.getDocument(id);
    renderPanel(doc);
    document.getElementById("docs-layout").classList.remove("showing-list");
    document.getElementById("docs-layout").classList.add("showing-detail");
  }

  function renderPanel(doc) {
    const panel = document.getElementById("doc-panel");
    const risk = doc.compliance_risk || "low";
    const riskLabel = { high: "High fair housing risk", caution: "Some issues flagged", low: "No issues detected" }[risk];

    const flagsHtml = (doc.compliance_flags || [])
      .map((f) => `<div class="flag-card"><div class="phrase">"${f.phrase || f.protected_class}"</div><div class="expl">${f.explanation || f.note || ""}</div></div>`)
      .join("");

    panel.innerHTML = `
      <button class="back-to-docs-btn" id="back-to-docs-btn">← All documents</button>
      <div class="doc-header">
        <div>
          <div class="doc-title">${doc.title}</div>
          <div class="doc-meta-row">${TYPE_LABELS[doc.doc_type] || doc.doc_type} · ${doc.source} · rev. ${doc.revision_count} · ${doc.status}</div>
        </div>
        <div class="doc-actions">
          <button class="btn btn-outline" id="rescan-btn">Re-scan</button>
        </div>
      </div>

      <div class="risk-banner ${risk}">⚠️ ${riskLabel}</div>
      ${flagsHtml}

      <textarea id="doc-content" readonly>${doc.content}</textarea>

      <div class="rework-row">
        <input type="text" id="rework-instructions" placeholder="Optional: additional instructions for the rework…" />
        <button class="btn btn-primary" id="rework-btn">Auto-rework</button>
      </div>
    `;

    document.getElementById("rescan-btn").addEventListener("click", async () => {
      const updated = await api.scoreDocument(doc.id);
      await loadDocuments();
      renderPanel(updated);
    });

    document.getElementById("rework-btn").addEventListener("click", async (e) => {
      const btn = e.target;
      btn.disabled = true;
      btn.style.display = "none";
      const spinnerMount = document.createElement("div");
      spinnerMount.id = "rework-spinner-mount";
      btn.insertAdjacentElement("afterend", spinnerMount);
      const spinner = createAthenaSpinner(spinnerMount, { size: "sm" });
      spinner.start();

      const instructions = document.getElementById("rework-instructions").value;
      try {
        const updated = await api.reworkDocument(doc.id, instructions || null);
        await loadDocuments();
        renderPanel(updated);
      } catch (err) {
        spinner.stop();
        btn.style.display = "inline-flex";
        btn.disabled = false;
        await systemAlert(err.message);
      }
    });

    document.getElementById("back-to-docs-btn").addEventListener("click", () => {
      document.getElementById("docs-layout").classList.remove("showing-detail");
      document.getElementById("docs-layout").classList.add("showing-list");
    });
  }

  document.getElementById("file-input").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const doc = await api.uploadDocument(file, "uploaded_other");
      await loadDocuments();
      selectDocument(doc.id);
    } catch (err) {
      await systemAlert(err.message);
    }
    e.target.value = "";
  });

  async function loadDocTypes() {
    const types = await api.getDocumentTypes();
    const select = document.getElementById("new-doc-type");
    select.innerHTML = types
      .filter((t) => t !== "uploaded_other")
      .map((t) => `<option value="${t}">${TYPE_LABELS[t] || t}</option>`)
      .join("");
  }

  document.getElementById("new-doc-btn").addEventListener("click", () => {
    document.getElementById("modal-backdrop").classList.add("open");
  });
  document.getElementById("modal-cancel").addEventListener("click", () => {
    document.getElementById("modal-backdrop").classList.remove("open");
  });
  document.getElementById("modal-generate").addEventListener("click", async () => {
    const doc_type = document.getElementById("new-doc-type").value;
    const title = document.getElementById("new-doc-title").value || TYPE_LABELS[doc_type];
    const instructions = document.getElementById("new-doc-instructions").value;

    const btn = document.getElementById("modal-generate");
    btn.disabled = true;
    btn.textContent = "Generating…";

    try {
      const doc = await api.generateDocument({ title, doc_type, instructions: instructions || null });
      document.getElementById("modal-backdrop").classList.remove("open");
      await loadDocuments();
      selectDocument(doc.id);
    } catch (err) {
      await systemAlert(err.message);
    }
    btn.disabled = false;
    btn.textContent = "Generate";
  });

  loadDocuments();
  loadDocTypes();
</script>
</body>
</html>
