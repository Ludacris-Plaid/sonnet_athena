<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="../shared/assets/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — RealtyAI</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css" />
<style>
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-card { width: 100%; max-width: 380px; background: #fff; border: 1px solid var(--olive-200); border-radius: 16px; padding: 36px 32px; box-shadow: var(--shadow-card); }
  .auth-brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 19px; font-weight: 700; color: var(--olive-800); margin-bottom: 26px; }
  .auth-title { font-size: 21px; margin-bottom: 6px; }
  .auth-sub { font-size: 13.5px; color: var(--ink-500); margin-bottom: 24px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-700); margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 13px; border: 1px solid var(--olive-200); border-radius: 8px;
    font-size: 14px; margin-bottom: 16px; font-family: var(--font-body);
  }
  input:focus { outline: 2px solid var(--gold-400); outline-offset: 1px; border-color: transparent; }
  .btn-primary { width: 100%; justify-content: center; padding: 12px; }
  .auth-footer { font-size: 13px; color: var(--ink-500); margin-top: 18px; text-align: center; }
  .error-msg { background: #fbe9e5; color: var(--danger); font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">🦉 Athena</div>
    <div class="auth-title display">Welcome back</div>
    <div class="auth-sub">Log in to keep working with Athena.</div>

    <div class="error-msg" id="error-msg"></div>

    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" />

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" />

      <button type="submit" class="btn btn-primary">Log in</button>
    </form>

    <div class="auth-footer">Have an invite code? <a href="/app/signup.html" style="color:var(--gold-600); font-weight:600;">Create an account</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/supabase-client.js"></script>
<script src="../shared/api.js"></script>
<script>
  // Wipe any stale Supabase session (from a deleted/old account) so the
  // fresh sign-in below can't be shadowed by a cached dead token.
  (function clearStaleSession() {
    try {
      Object.keys(localStorage).filter((k) => k.indexOf("sb-") === 0 || k.indexOf("supabase") === 0).forEach((k) => localStorage.removeItem(k));
      Object.keys(sessionStorage).filter((k) => k.indexOf("sb-") === 0 || k.indexOf("supabase") === 0).forEach((k) => sessionStorage.removeItem(k));
    } catch (e) {}
  })();

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("error-msg");
    errorEl.style.display = "none";

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      await supabaseAuth.signIn(email, password);
      window.location.href = "/app/inbox.html";
    } catch (err) {
      errorEl.textContent = err.message || "Login failed. Check your credentials.";
      errorEl.style.display = "block";
    }
  });
</script>
</body>
</html>
