<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="../shared/assets/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calendar — RealtyAI</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css" />
<link rel="stylesheet" href="../shared/app-shell.css" />
<style>
  .cal-header { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .cal-header h2 { font-family: var(--font-display); font-size: 22px; min-width: 220px; }
  .cal-nav-btn { background: #fff; border: 1px solid var(--olive-200); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 14px; }

  .cal-legend { display: flex; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .cal-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-700); }
  .cal-legend-dot { width: 10px; height: 10px; border-radius: 3px; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid var(--olive-200); border-radius: 12px; overflow: hidden; background: var(--olive-200); gap: 1px; }
  .cal-dow { background: var(--cream-dim); padding: 8px; text-align: center; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--ink-500); }
  .cal-cell { background: #fff; min-height: 104px; padding: 8px; cursor: pointer; transition: background 0.1s; }
  .cal-cell:hover { background: var(--cream-dim); }
  .cal-cell.other-month { background: var(--cream-dim); opacity: 0.6; }
  .cal-cell.today { background: var(--gold-100); }
  .cal-day-num { font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
  .cal-event-dot { font-size: 10px; color: #fff; border-radius: 4px; padding: 1px 5px; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cal-event-dot.general { background: var(--olive-800); }
  .cal-event-dot.showing { background: var(--gold-500); color: var(--ink-900); }
  .cal-event-dot.closing { background: var(--success); }
  .cal-event-dot.call { background: #6b8fb5; }
  .cal-event-dot.meeting { background: #a37cc9; }

  /* Day detail modal */
  .day-modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(36,31,24,0.55); align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .day-modal-backdrop.open { display: flex; }
  .day-modal { background: #fff; border-radius: 16px; padding: 26px; width: 460px; max-width: 100%; max-height: 88vh; overflow-y: auto; }
  .day-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .day-modal-header h3 { font-family: var(--font-display); font-size: 19px; }
  .day-modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--ink-500); }

  .event-item { padding: 12px; border-radius: 10px; margin-bottom: 8px; cursor: pointer; border: 1px solid var(--olive-200); }

  .reminder-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--cream-dim); font-size: 12.5px; }
  .reminder-row:first-child { border-top: none; }
  .reminder-row .time { color: var(--ink-500); font-size: 11px; min-width: 52px; }
  .reminder-row .note { flex: 1; }
  .reminder-row .del-reminder { color: var(--danger); cursor: pointer; font-size: 13px; }
  .cal-reminder-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold-600); display: inline-block; margin-left: 2px; }
  .event-item:hover { border-color: var(--gold-400); }
  .event-item-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .event-item .title { font-weight: 700; font-size: 13.5px; }
  .event-item .time { color: var(--ink-500); font-size: 11.5px; margin-top: 2px; }
  .event-type-tag { font-size: 9.5px; font-weight: 700; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; color: #fff; }

  .day-form { border-top: 1px solid var(--cream-dim); padding-top: 16px; margin-top: 6px; }
  .day-form h4 { font-size: 13px; margin-bottom: 10px; }
  .day-form input, .day-form select, .day-form textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--olive-200); border-radius: 8px; font-size: 13px; margin-bottom: 10px;
  }
  .day-form-actions { display: flex; gap: 8px; }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar-mount" data-active="calendar"></aside>

  <div class="main-col">
    <div class="topbar">
      <div class="topbar-search">🔍 Ask about clients, listings, tasks, regulations…</div>
      <div class="topbar-user"><div class="avatar-chip">A</div><div class="name">Test Agent</div></div>
    </div>

    <div class="page-body">
      <div class="cal-header">
        <button class="cal-nav-btn" id="prev-month">←</button>
        <h2 id="month-label"></h2>
        <button class="cal-nav-btn" id="next-month">→</button>
        <a href="/app/integrations.html" class="btn btn-outline" style="margin-left:auto; font-size:12.5px;">Connect Google/Outlook Calendar</a>
        <a href="/app/inbox.html?ask=What%27s%20on%20my%20calendar%20this%20week%3F" class="btn btn-outline" style="font-size:12.5px;">🦉 Ask Athena about your schedule</a>
      </div>

      <div class="cal-legend">
        <div class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--olive-800);"></span> General</div>
        <div class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--gold-500);"></span> Showing</div>
        <div class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--success);"></span> Closing</div>
        <div class="cal-legend-item"><span class="cal-legend-dot" style="background:#6b8fb5;"></span> Call</div>
        <div class="cal-legend-item"><span class="cal-legend-dot" style="background:#a37cc9;"></span> Meeting</div>
      </div>

      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </div>
</div>

<div class="day-modal-backdrop" id="day-modal-backdrop">
  <div class="day-modal">
    <div class="day-modal-header">
      <h3 id="day-modal-title"></h3>
      <button class="day-modal-close" id="day-modal-close">✕</button>
    </div>
    <div id="day-events-list"></div>

    <div style="border-top: 1px solid var(--cream-dim); margin: 16px 0; padding-top: 14px;">
      <h4 style="font-size:13px; margin-bottom:10px;">⏰ Reminders</h4>
      <div id="day-reminders-list"></div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <input type="text" id="reminder-note" placeholder="Quick note…" style="flex:1; padding:8px 10px; border:1px solid var(--olive-200); border-radius:7px; font-size:12.5px;" />
        <input type="time" id="reminder-time" value="09:00" style="padding:8px 10px; border:1px solid var(--olive-200); border-radius:7px; font-size:12.5px; width:110px;" />
        <button class="btn btn-outline" id="add-reminder-btn" style="font-size:12px; padding:8px 12px;">Add</button>
      </div>
    </div>

    <div class="day-form" id="day-form">
      <h4 id="day-form-title">Add event</h4>
      <input type="hidden" id="edit-event-id" />
      <input type="text" id="form-title" placeholder="Title" />
      <select id="form-type">
        <option value="general">General</option>
        <option value="showing">Showing</option>
        <option value="closing">Closing</option>
        <option value="call">Call</option>
        <option value="meeting">Meeting</option>
      </select>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <input type="time" id="form-start-time" value="10:00" />
        <input type="time" id="form-end-time" value="11:00" />
      </div>
      <input type="text" id="form-location" placeholder="Location (optional)" />
      <div class="day-form-actions">
        <button class="btn btn-primary" id="form-save-btn" style="flex:1; justify-content:center;">Add to calendar</button>
        <button class="btn btn-outline" id="form-cancel-edit-btn" style="display:none;">Cancel</button>
        <button class="btn btn-outline" id="form-delete-btn" style="display:none; color:var(--danger); border-color:var(--danger);">Delete</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/supabase-client.js"></script>
<script src="../shared/api.js"></script>
<script src="../shared/sidebar.js"></script>
<script src="../shared/system-modal.js"></script>
<script>
  auth.requireAuth();

  let viewDate = new Date();
  let selectedDate = new Date();
  let monthEvents = [];
  let editingEventId = null;

  function isoDate(d) { return d.toISOString().slice(0, 10); }
  function sameDay(a, b) { return isoDate(a) === isoDate(b); }

  let monthReminders = [];

  async function loadMonth() {
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const start = new Date(year, month, 1);
    const end = new Date(year, month + 1, 1);
    monthEvents = await api.listCalendarEvents(start.toISOString(), end.toISOString());
    monthReminders = await api.listReminders(start.toISOString(), end.toISOString());
    renderGrid();
  }

  function renderGrid() {
    document.getElementById("month-label").textContent = viewDate.toLocaleDateString([], { month: "long", year: "numeric" });

    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const firstDay = new Date(year, month, 1);
    const startOffset = firstDay.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = new Date();

    const grid = document.getElementById("cal-grid");
    const dows = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    let html = dows.map((d) => `<div class="cal-dow">${d}</div>`).join("");

    const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
    for (let i = 0; i < totalCells; i++) {
      const dayNum = i - startOffset + 1;
      const cellDate = new Date(year, month, dayNum);
      const inMonth = dayNum >= 1 && dayNum <= daysInMonth;
      const dayEvents = monthEvents.filter((e) => sameDay(new Date(e.start_at), cellDate));
      const dayReminders = monthReminders.filter((r) => sameDay(new Date(r.remind_at), cellDate));

      html += `
        <div class="cal-cell ${!inMonth ? "other-month" : ""} ${sameDay(cellDate, today) ? "today" : ""}" data-date="${isoDate(cellDate)}">
          <div class="cal-day-num">${cellDate.getDate()}${dayReminders.length ? '<span class="cal-reminder-dot" title="' + dayReminders.length + ' reminder(s)"></span>' : ""}</div>
          ${dayEvents.slice(0, 3).map((e) => `<div class="cal-event-dot ${e.event_type}">${e.title}</div>`).join("")}
          ${dayEvents.length > 3 ? `<div style="font-size:10px; color:var(--ink-500);">+${dayEvents.length - 3} more</div>` : ""}
        </div>`;
    }
    grid.innerHTML = html;

    grid.querySelectorAll(".cal-cell").forEach((cell) => {
      cell.addEventListener("click", () => {
        selectedDate = new Date(cell.dataset.date + "T00:00:00");
        openDayModal();
      });
    });
  }

  function openDayModal() {
    document.getElementById("day-modal-title").textContent = selectedDate.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
    resetForm();
    renderDayEvents();
    renderDayReminders();
    document.getElementById("day-modal-backdrop").classList.add("open");
  }

  function renderDayReminders() {
    const dayReminders = monthReminders.filter((r) => sameDay(new Date(r.remind_at), selectedDate));
    const container = document.getElementById("day-reminders-list");
    container.innerHTML = dayReminders.length
      ? dayReminders
          .map(
            (r) => `
      <div class="reminder-row">
        <span class="time">${new Date(r.remind_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span>
        <span class="note">${r.note}</span>
        <span class="del-reminder" data-id="${r.id}" title="Done / remove">✓</span>
      </div>`
          )
          .join("")
      : '<div style="color:var(--ink-500); font-size:12.5px;">No reminders for this day.</div>';

    container.querySelectorAll(".del-reminder").forEach((el) => {
      el.addEventListener("click", async () => {
        await api.completeReminder(el.dataset.id);
        await loadMonth();
        renderDayReminders();
      });
    });
  }

  document.getElementById("add-reminder-btn").addEventListener("click", async () => {
    const note = document.getElementById("reminder-note").value.trim();
    if (!note) return systemAlert("Add a quick note for the reminder.");
    const time = document.getElementById("reminder-time").value;
    const remindAt = new Date(`${isoDate(selectedDate)}T${time}:00`);

    await api.createReminder({ note, remind_at: remindAt.toISOString() });
    document.getElementById("reminder-note").value = "";
    await loadMonth();
    renderDayReminders();
  });

  function renderDayEvents() {
    const dayEvents = monthEvents.filter((e) => sameDay(new Date(e.start_at), selectedDate));
    const container = document.getElementById("day-events-list");
    container.innerHTML = dayEvents.length
      ? dayEvents
          .map(
            (e) => `
      <div class="event-item" data-event-id="${e.id}">
        <div class="event-item-top">
          <div>
            <div class="title">${e.title}</div>
            <div class="time">${new Date(e.start_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })} – ${new Date(e.end_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}${e.location ? " · " + e.location : ""}</div>
          </div>
          <span class="event-type-tag" style="background:${eventTypeColor(e.event_type)};">${e.event_type}</span>
        </div>
      </div>`
          )
          .join("")
      : '<div style="color:var(--ink-500); font-size:13px; padding:10px 0;">No events this day yet.</div>';

    container.querySelectorAll(".event-item").forEach((el) => {
      el.addEventListener("click", () => loadEventIntoForm(el.dataset.eventId));
    });
  }

  function eventTypeColor(type) {
    return { general: "var(--olive-800)", showing: "var(--gold-500)", closing: "var(--success)", call: "#6b8fb5", meeting: "#a37cc9" }[type] || "var(--olive-800)";
  }

  function resetForm() {
    editingEventId = null;
    document.getElementById("day-form-title").textContent = "Add event";
    document.getElementById("form-title").value = "";
    document.getElementById("form-type").value = "general";
    document.getElementById("form-start-time").value = "10:00";
    document.getElementById("form-end-time").value = "11:00";
    document.getElementById("form-location").value = "";
    document.getElementById("form-save-btn").textContent = "Add to calendar";
    document.getElementById("form-cancel-edit-btn").style.display = "none";
    document.getElementById("form-delete-btn").style.display = "none";
  }

  function loadEventIntoForm(eventId) {
    const e = monthEvents.find((ev) => ev.id === eventId);
    if (!e) return;
    editingEventId = eventId;
    document.getElementById("day-form-title").textContent = `Editing "${e.title}"`;
    document.getElementById("form-title").value = e.title;
    document.getElementById("form-type").value = e.event_type;
    document.getElementById("form-start-time").value = new Date(e.start_at).toTimeString().slice(0, 5);
    document.getElementById("form-end-time").value = new Date(e.end_at).toTimeString().slice(0, 5);
    document.getElementById("form-location").value = e.location || "";
    document.getElementById("form-save-btn").textContent = "Save changes";
    document.getElementById("form-cancel-edit-btn").style.display = "inline-flex";
    document.getElementById("form-delete-btn").style.display = "inline-flex";
  }

  document.getElementById("form-delete-btn").addEventListener("click", async () => {
    if (!editingEventId) return;
    const ok = await systemConfirm("Delete this event?", { danger: true, confirmLabel: "Delete" });
    if (!ok) return;
    await api.deleteCalendarEvent(editingEventId);
    await loadMonth();
    resetForm();
    renderDayEvents();
  });

  document.getElementById("form-cancel-edit-btn").addEventListener("click", resetForm);

  document.getElementById("form-save-btn").addEventListener("click", async () => {
    const title = document.getElementById("form-title").value.trim();
    if (!title) return await systemAlert("Title is required.");
    const dateStr = isoDate(selectedDate);
    const startAt = new Date(`${dateStr}T${document.getElementById("form-start-time").value}:00`);
    const endAt = new Date(`${dateStr}T${document.getElementById("form-end-time").value}:00`);
    const payload = {
      title,
      event_type: document.getElementById("form-type").value,
      location: document.getElementById("form-location").value || null,
      start_at: startAt.toISOString(),
      end_at: endAt.toISOString(),
      all_day: false,
    };

    if (editingEventId) {
      await api.updateCalendarEvent(editingEventId, payload);
    } else {
      await api.createCalendarEvent(payload);
    }

    await loadMonth();
    resetForm();
    renderDayEvents();
  });

  document.getElementById("day-modal-close").addEventListener("click", () => {
    document.getElementById("day-modal-backdrop").classList.remove("open");
  });

  document.getElementById("prev-month").addEventListener("click", () => {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1);
    loadMonth();
  });
  document.getElementById("next-month").addEventListener("click", () => {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
    loadMonth();
  });

  loadMonth();
</script>
</body>
</html>
