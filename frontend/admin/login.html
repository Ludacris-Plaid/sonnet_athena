<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="../shared/assets/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — RealtyAI</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css" />
<style>
  body { background: var(--olive-900); }
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-card {
    width: 100%; max-width: 380px; background: rgba(244,240,230,0.04); border: 1px solid rgba(244,240,230,0.14);
    border-radius: 16px; padding: 36px 32px; backdrop-filter: blur(6px);
  }
  .auth-brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 19px; font-weight: 700; color: #fff; margin-bottom: 6px; }
  .auth-tag { font-size: 12px; color: var(--gold-400); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; margin-bottom: 24px; }
  label { display: block; font-size: 13px; font-weight: 600; color: rgba(244,240,230,0.8); margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 13px; border: 1px solid rgba(244,240,230,0.2); border-radius: 8px;
    font-size: 14px; margin-bottom: 16px; background: rgba(0,0,0,0.15); color: #fff; font-family: var(--font-body);
  }
  input:focus { outline: 2px solid var(--gold-400); outline-offset: 1px; }
  input::placeholder { color: rgba(244,240,230,0.35); }
  .btn-primary { width: 100%; justify-content: center; padding: 12px; }
  .error-msg { background: rgba(168,67,47,0.2); border: 1px solid rgba(168,67,47,0.4); color: #f4b8ab; font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
  .back-link { display: block; text-align: center; margin-top: 18px; font-size: 12.5px; color: rgba(244,240,230,0.5); text-decoration: none; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">🦉 Athena</div>
    <div class="auth-tag">Platform Admin</div>

    <div class="error-msg" id="error-msg"></div>

    <form id="admin-login-form">
      <label for="email">Admin email</label>
      <input type="email" id="email" required autocomplete="email" />

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" />

      <button type="submit" class="btn btn-primary">Access Admin Console</button>
    </form>

    <a href="/app/login.html" class="back-link">← Back to regular login</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/supabase-client.js"></script>
<script src="../shared/api.js"></script>
<script>
  document.getElementById("admin-login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("error-msg");
    errorEl.style.display = "none";

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      await supabaseAuth.signIn(email, password);
      // Authentication succeeded — now verify admin status SERVER-SIDE
      // before letting them anywhere near the admin console. A valid
      // Supabase session alone is not enough; is_admin is checked by the
      // backend, not trusted from anything client-side.
      await api.adminMe();
      window.location.href = "/admin/dashboard.html";
    } catch (err) {
      await supabaseAuth.signOut(); // don't leave a non-admin session sitting around after a failed admin check
      errorEl.textContent = "That account doesn't have admin access, or the credentials are wrong.";
      errorEl.style.display = "block";
    }
  });
</script>
</body>
</html>
