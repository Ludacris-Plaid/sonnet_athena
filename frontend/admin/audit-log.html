<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="../shared/assets/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Audit Log — Admin — RealtyAI</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css" />
<link rel="stylesheet" href="../shared/app-shell.css" />
<style>
  .admin-body { padding: 32px; max-width: 1100px; margin: 0 auto; }
  .log-row { display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-bottom: 1px solid var(--cream-dim); font-size: 13px; }
  .log-row:last-child { border-bottom: none; }
  .source-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; flex-shrink: 0; margin-top: 2px; }
  .source-tag.ui { background: var(--cream-dim); color: var(--ink-700); }
  .source-tag.agent { background: var(--gold-100); color: var(--gold-600); }
  .log-body { flex: 1; }
  .log-action { font-weight: 700; margin-bottom: 3px; }
  .log-meta { color: var(--ink-500); font-size: 12px; }
  .log-detail { color: var(--ink-700); font-size: 12px; margin-top: 4px; font-family: monospace; background: var(--cream-dim); padding: 6px 8px; border-radius: 6px; }
</style>
</head>
<body>
<div id="admin-nav-mount" data-active="audit"></div>

<div class="admin-body">
  <div class="page-title display" style="margin-bottom:6px;">Audit Log</div>
  <div class="page-sub" style="margin-bottom:22px;">Every admin action — whether a button click or the admin Athena agent — permanently recorded here.</div>

  <div class="card" style="padding:0;" id="log-container"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/supabase-client.js"></script>
<script src="../shared/api.js"></script>
<script src="../shared/admin-nav.js"></script>
<script>
  auth.requireAuth();

  const ACTION_LABELS = {
    user_status_active: "Reinstated user",
    user_status_suspended: "Suspended user",
    user_status_banned: "Banned user",
    user_profile_update: "Updated user profile",
    adjust_plan_tier: "Changed plan tier",
    org_activate: "Activated organization",
    org_deactivate: "Deactivated organization",
  };

  async function loadLog() {
    const entries = await api.adminAuditLog(150);
    const container = document.getElementById("log-container");

    if (!entries.length) {
      container.innerHTML = `<div style="padding:40px; text-align:center; color:var(--ink-500); font-size:13.5px;">No admin actions logged yet.</div>`;
      return;
    }

    container.innerHTML = entries
      .map(
        (e) => `
      <div class="log-row">
        <span class="source-tag ${e.source}">${e.source === "agent" ? "Athena" : "UI"}</span>
        <div class="log-body">
          <div class="log-action">${ACTION_LABELS[e.action] || e.action}${e.target_type ? ` · ${e.target_type}` : ""}</div>
          <div class="log-meta">${e.admin_email || "unknown admin"} · ${new Date(e.created_at).toLocaleString()}</div>
          ${e.detail ? `<div class="log-detail">${JSON.stringify(e.detail)}</div>` : ""}
        </div>
      </div>`
      )
      .join("");
  }

  loadLog();
</script>
</body>
</html>
